# Alembic configuration.
#
# sqlalchemy.url is deliberately absent: the URL comes from DATABASE_URL via
# app.core.config (migrations/env.py), so there is exactly one place a
# connection string is defined and no chance of migrations running against a
# different database than the app.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# UTC, and a timestamp prefix so `ls versions/` reads in apply order.
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# No post-write hooks.
#
# A `console_scripts` ruff hook does not work (ruff ships a binary, not a
# console_scripts entrypoint) and an `exec` hook depends on ruff being on PATH,
# which it is not when alembic is invoked as .venv/bin/alembic. Rather than a
# hook that fails noisily on every generation, run `make fmt` after creating a
# revision -- CI lints migrations/ like any other code, so an unformatted
# revision fails the build and cannot be forgotten.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
