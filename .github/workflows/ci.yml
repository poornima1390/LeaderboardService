name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Supersede in-flight runs for the same ref: a force-push should not leave
  # two runs racing to report a status. The deploy job opts out of this (see
  # its own concurrency block) so a rollout is never cancelled half-done.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  # Lint and types are split from tests so a formatting failure reports in
  # seconds without waiting for service containers to boot.
  static:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff (lint)
        run: ruff check --output-format=github .

      - name: ruff (format)
        run: ruff format --check .

      - name: mypy --strict
        run: mypy app tests

  test:
    name: Tests
    runs-on: ubuntu-latest

    # Real Postgres and Redis rather than mocks. The design's central risk is
    # the two stores disagreeing about ranking (Spec.md D2/D3), and a mock
    # cannot disagree with anything.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: leaderboard
          POSTGRES_PASSWORD: leaderboard
          POSTGRES_DB: leaderboard_test
          # Deliberately NON-C, so CI is adversarial: a column missing its
          # COLLATE "C" (Spec.md D3) diverges from Redis here and fails, rather
          # than passing locally and breaking on a managed database whose
          # collation we do not control.
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leaderboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: ci
      LOG_LEVEL: WARNING
      DATABASE_URL: postgresql+asyncpg://leaderboard:leaderboard@localhost:5432/leaderboard_test
      REDIS_URL: redis://localhost:6379/0
      API_KEY: 7f3c91ab5e2d4806bc1f9a73de50c284
      ADMIN_API_KEY: d4a82fe07c6b13594ea2f8db60371cae

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify migrations are reversible
        # A migration that cannot be rolled back is a deploy that cannot be
        # aborted. Cheap to check here, expensive to discover during an incident.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Verify migrations match the models
        # `alembic check` fails if autogenerate would produce any operation,
        # i.e. if the migrations and the ORM models have drifted apart. The
        # integration tests build their schema from Base.metadata, so without
        # this gate they could pass against a schema the migrations never
        # produce -- and the deployed database would differ from the tested one.
        run: alembic check

      - name: pytest
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: leaderboard-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        # Proves the image boots and serves. No database is attached, so the
        # expected answer is 503 unhealthy — which still exercises config
        # loading, the ASGI stack, routing and the error envelope. A container
        # that crash-loops fails here instead of on App Platform.
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e ENVIRONMENT=ci \
            -e DATABASE_URL=postgresql+asyncpg://u:p@127.0.0.1:5432/db \
            -e API_KEY=7f3c91ab5e2d4806bc1f9a73de50c284 \
            -e ADMIN_API_KEY=d4a82fe07c6b13594ea2f8db60371cae \
            leaderboard-service:ci

          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8080/health || true)
            if [ "$code" = "503" ] || [ "$code" = "200" ]; then
              echo "Service responded with $code"
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done

          echo "Service never became reachable:"
          docker logs smoke
          exit 1

      - name: Container logs
        if: always()
        run: docker logs smoke || true

  # ------------------------------------------------------------------------- #
  # Continuous deployment
  #
  # Deployment is driven from here rather than by App Platform's
  # `deploy_on_push`, and the difference matters: deploy_on_push reacts to the
  # push itself, so a commit that fails lint, types or tests would still ship.
  # This job `needs` all three gates, so CI is genuinely the gate.
  # ------------------------------------------------------------------------- #
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: [static, test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    concurrency:
      # Deploys queue instead of cancelling. Cancelling a rollout mid-flight
      # leaves the app in whatever state it had reached, which is the one
      # outcome worse than deploying slightly later.
      group: deploy-production
      cancel-in-progress: false

    environment:
      name: production
      url: ${{ steps.deploy.outputs.app_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Resolve app id
        id: app
        # Looked up by name rather than stored as a secret or hardcoded: the
        # id is not sensitive, and resolving it keeps the workflow working if
        # the app is ever recreated.
        run: |
          app_id=$(doctl apps list --format ID,Spec.Name --no-header \
            | awk '$2 == "leaderboard-service" {print $1; exit}')
          if [ -z "$app_id" ]; then
            echo "::error::No App Platform app named 'leaderboard-service'."
            echo "::error::Create it first: ./scripts/deploy_do.sh"
            exit 1
          fi
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"
          echo "Resolved app id: $app_id"

      - name: Deploy
        id: deploy
        # The app spec pins the source to the main branch, so creating a
        # deployment rebuilds from the commit this workflow is running for.
        # --wait blocks until the rollout is ACTIVE or has failed, which is
        # what makes a red build mean "not deployed".
        run: |
          set -o pipefail
          doctl apps create-deployment "${{ steps.app.outputs.app_id }}" --wait \
            --format ID,Phase --no-header | tee /tmp/deploy.txt
          phase=$(awk '{print $2}' /tmp/deploy.txt | tail -1)
          if [ "$phase" != "ACTIVE" ]; then
            echo "::error::Deployment finished in phase $phase"
            exit 1
          fi
          app_url=$(doctl apps get "${{ steps.app.outputs.app_id }}" \
            --format DefaultIngress --no-header)
          echo "app_url=$app_url" >> "$GITHUB_OUTPUT"

      - name: Verify the deployed service is serving
        # App Platform already health-checks the container, but that only
        # proves the rollout believed itself healthy. This asserts the public
        # ingress actually answers, which is what a user experiences.
        #
        # 200 covers both "ok" and "degraded" -- degraded is a serving state by
        # design, since reads fall back to Postgres when Redis is absent
        # (Spec.md D2, §4). Only a non-200 is a failure.
        run: |
          url="${{ steps.deploy.outputs.app_url }}"
          for attempt in $(seq 1 20); do
            code=$(curl -fsS -o /tmp/health.json -w '%{http_code}' "$url/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Healthy: HTTP $code"
              cat /tmp/health.json
              status=$(jq -r .status /tmp/health.json)
              echo "status=$status"
              [ "$status" = "degraded" ] && \
                echo "::notice::Serving in degraded mode (no Redis attached) - expected for now"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 10
          done
          echo "::error::Deployed service never returned 200 from /health"
          doctl apps logs "${{ steps.app.outputs.app_id }}" api --type run --tail 50 || true
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App | \`${{ steps.app.outputs.app_id }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.app_url }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
