# DigitalOcean App Platform specification.
#
# Applied by scripts/deploy_do.sh, which substitutes the ${...} placeholders
# from the environment so no secret is ever committed to this repository.
#
# Source is a plain `git` clone rather than a `github` integration, for two
# reasons:
#
#   1. A `github` source requires the DigitalOcean GitHub App to be authorised
#      interactively in the dashboard. A `git` source needs only an API token,
#      so the whole deploy is scriptable and reproducible from a clean machine.
#   2. `github.deploy_on_push` would deploy on every push to main *regardless
#      of whether CI passed*. Deployments are instead triggered by the `deploy`
#      job in .github/workflows/ci.yml, which runs only after lint, types,
#      tests and the image build have all gone green. CI is the gate.
name: leaderboard-service
region: nyc

databases:
  # A dev database, not a production cluster: this is an exercise deployment
  # and the difference is ~$7/mo against ~$60/mo. The application is
  # indifferent — it receives a standard DATABASE_URL either way.
  - name: leaderboard-db
    engine: PG
    version: "17"
    production: false

  # The rank index (Spec.md D2).
  #
  # `production: true` is not a choice: DigitalOcean has no dev tier for
  # managed Valkey, unlike Postgres. Referenced by cluster_name rather than
  # provisioned inline, because the cluster was created first so its TLS
  # behaviour could be verified before a deploy depended on it.
  #
  # Valkey 8 reports `redis_version: 7.2.4` as a compatibility alias, which
  # clears the >= 6.2 requirement for ZADD GT — the command the whole outbox
  # design rests on. The service checks this at startup rather than assuming
  # it (app/repositories/rank_index.py).
  #
  # This remains derived, rebuildable state. Losing it costs a rebuild from
  # Postgres, never data: POST /v1/admin/leaderboards/rebuild.
  - name: leaderboard-cache
    engine: VALKEY
    version: "8"
    production: true
    cluster_name: leaderboard-cache

services:
  - name: api
    dockerfile_path: Dockerfile
    http_port: 8080

    git:
      repo_clone_url: https://github.com/${GITHUB_REPO}.git
      branch: main

    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb

    health_check:
      http_path: /health
      # Generous initial delay: the container boots Python and builds
      # connection pools before it can answer. Too tight a value here shows up
      # as a deploy that flaps rather than one that fails cleanly.
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    envs:
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production

      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO

      # Bound from the attached database. DigitalOcean supplies a
      # postgresql://...?sslmode=require URL; app.core.config rewrites the
      # scheme for asyncpg and moves sslmode into connect_args, because the
      # asyncpg dialect rejects the parameter outright.
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${leaderboard-db.DATABASE_URL}

      # DigitalOcean supplies a rediss:// URL. Unlike the Postgres one, its
      # certificate verifies against the default trust store, so no
      # ssl_cert_reqs relaxation is needed and full TLS verification is kept.
      # Verified against the live cluster before deploying.
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${leaderboard-cache.DATABASE_URL}

      - key: API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${LB_API_KEY}

      - key: ADMIN_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${LB_ADMIN_API_KEY}

jobs:
  # Migrations run here, as a PRE_DEPLOY job, and never at application startup.
  # App Platform runs this once per deploy before any new instance takes
  # traffic — exactly the guarantee needed, since concurrent instances racing
  # to migrate on boot is a reliable way to corrupt a deploy (Spec.md §8).
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: Dockerfile
    git:
      repo_clone_url: https://github.com/${GITHUB_REPO}.git
      branch: main
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: alembic upgrade head
    # REDIS_URL is deliberately omitted here: a migration never touches the
    # rank index, and REDIS_URL is optional in config, so the job simply runs
    # without one rather than carrying a binding it cannot use.
    envs:
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${leaderboard-db.DATABASE_URL}
      # The migration job loads the same Settings object as the service, which
      # requires these to be present and non-placeholder even though a
      # migration never uses them.
      - key: API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${LB_API_KEY}
      - key: ADMIN_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${LB_ADMIN_API_KEY}
