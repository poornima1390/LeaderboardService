# DigitalOcean App Platform specification.
#
# Applied by scripts/deploy_do.sh, which substitutes the ${...} placeholders
# from the environment so no secret is ever committed to this repository.
#
# Source is a plain `git` clone rather than a `github` integration, for two
# reasons:
#
#   1. A `github` source requires the DigitalOcean GitHub App to be authorised
#      interactively in the dashboard. A `git` source needs only an API token,
#      so the whole deploy is scriptable and reproducible from a clean machine.
#   2. `github.deploy_on_push` would deploy on every push to main *regardless
#      of whether CI passed*. Deployments are instead triggered by the `deploy`
#      job in .github/workflows/ci.yml, which runs only after lint, types,
#      tests and the image build have all gone green. CI is the gate.
name: leaderboard-service
region: nyc

databases:
  # A dev database, not a production cluster: this is an exercise deployment
  # and the difference is ~$7/mo against ~$60/mo. The application is
  # indifferent — it receives a standard DATABASE_URL either way.
  - name: leaderboard-db
    engine: PG
    version: "17"
    production: false

  # NOTE: Redis is deliberately absent.
  #
  # The rank index is derived state, and the service is built to serve
  # correctly without it: reads fall back to Postgres and /health reports
  # "degraded" rather than failing (Spec.md D2, §4). DigitalOcean has no dev
  # tier for managed Valkey/Redis, so attaching one costs ~$15/mo for a
  # capability Phases 2-3 have not started using yet. Deploying without it
  # exercises the degraded path for real instead of assuming it works.
  #
  # To add it later:
  #   - name: leaderboard-cache
  #     engine: VALKEY
  #     version: "8"
  #     production: true
  # ...then set REDIS_URL to ${leaderboard-cache.DATABASE_URL} on both the
  # service and the migrate job.

services:
  - name: api
    dockerfile_path: Dockerfile
    http_port: 8080

    git:
      repo_clone_url: https://github.com/${GITHUB_REPO}.git
      branch: main

    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb

    health_check:
      http_path: /health
      # Generous initial delay: the container boots Python and builds
      # connection pools before it can answer. Too tight a value here shows up
      # as a deploy that flaps rather than one that fails cleanly.
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    envs:
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production

      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO

      # Bound from the attached database. DigitalOcean supplies a
      # postgresql://...?sslmode=require URL; app.core.config rewrites the
      # scheme for asyncpg and moves sslmode into connect_args, because the
      # asyncpg dialect rejects the parameter outright.
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${leaderboard-db.DATABASE_URL}

      - key: API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${LB_API_KEY}

      - key: ADMIN_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${LB_ADMIN_API_KEY}

jobs:
  # Migrations run here, as a PRE_DEPLOY job, and never at application startup.
  # App Platform runs this once per deploy before any new instance takes
  # traffic — exactly the guarantee needed, since concurrent instances racing
  # to migrate on boot is a reliable way to corrupt a deploy (Spec.md §8).
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: Dockerfile
    git:
      repo_clone_url: https://github.com/${GITHUB_REPO}.git
      branch: main
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: alembic upgrade head
    envs:
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${leaderboard-db.DATABASE_URL}
      # The migration job loads the same Settings object as the service, which
      # requires these to be present and non-placeholder even though a
      # migration never uses them.
      - key: API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${LB_API_KEY}
      - key: ADMIN_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${LB_ADMIN_API_KEY}
