# DigitalOcean App Platform specification.
#
# Applied by scripts/deploy_do.sh, which substitutes the ${...} placeholders
# from the environment so that no secret is ever committed to this repository.
#
#   doctl apps create  --spec <(envsubst < .do/app.yaml)     # first deploy
#   doctl apps update <id> --spec <(envsubst < .do/app.yaml)  # subsequent
name: leaderboard-service
region: nyc

databases:
  # A dev database, not a production cluster: this is an exercise deployment
  # and the cost difference is ~$7/mo versus ~$60/mo. The app is indifferent —
  # it receives a standard DATABASE_URL either way.
  - name: leaderboard-db
    engine: PG
    version: "17"
    production: false

  # NOTE: Redis is deliberately absent.
  #
  # The rank index is derived state, and the service is designed to serve
  # correctly without it — reads fall back to Postgres and /health reports
  # "degraded" (Spec.md D2, §4). DigitalOcean has no free managed Valkey/Redis
  # tier, so Phase 0 deploys without one and exercises the degraded path for
  # real rather than pretending it works. To add it:
  #
  #   - name: leaderboard-cache
  #     engine: VALKEY
  #     version: "8"
  #     production: true       # no dev tier exists for Valkey
  #
  # ...then set REDIS_URL to ${leaderboard-cache.DATABASE_URL} below.

services:
  - name: api
    dockerfile_path: Dockerfile
    http_port: 8080

    github:
      repo: ${GITHUB_REPO}
      branch: main
      # Redeploy on every push to main. CI gates merges, so main is the
      # release branch.
      deploy_on_push: true

    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb

    health_check:
      http_path: /health
      # Generous initial delay: the container must boot Python and build the
      # connection pools before it can answer. Too tight a delay here shows up
      # as a deploy that flaps rather than fails.
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    envs:
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production

      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO

      # Bound from the attached database. DigitalOcean supplies a
      # `postgresql://...?sslmode=require` URL; app.core.config rewrites the
      # scheme for asyncpg and moves sslmode into connect_args.
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${leaderboard-db.DATABASE_URL}

      - key: API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${LB_API_KEY}

      - key: ADMIN_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${LB_ADMIN_API_KEY}

jobs:
  # Migrations run here, as a PRE_DEPLOY job, and never at app startup.
  # App Platform runs this once per deploy before any new instance takes
  # traffic, which is exactly the guarantee needed: concurrent instances racing
  # to migrate on boot is a reliable way to corrupt a deploy (Spec.md §8).
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: Dockerfile
    github:
      repo: ${GITHUB_REPO}
      branch: main
      deploy_on_push: true
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: alembic upgrade head
    envs:
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${leaderboard-db.DATABASE_URL}
      # The migration job loads the same Settings object as the app, which
      # requires these to be present and non-placeholder even though a
      # migration never uses them.
      - key: API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${LB_API_KEY}
      - key: ADMIN_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${LB_ADMIN_API_KEY}
